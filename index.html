<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer Oficial do Treino</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    color:#333;
    text-align:center;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    margin-bottom:10px;
}

.block{
    font-size:22px;
    margin-top:15px;
    color:#666;
}

.exercise{
    font-size:30px;
    font-weight:bold;
    margin:15px 0;
}

.phase{
    font-size:28px;
    margin-top:10px;
}

.timer{
    font-size:90px;
    font-weight:bold;
    margin:20px 0;
}

.series{
    font-size:18px;
    margin-bottom:20px;
}

button{
    padding:15px 25px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.start{
    background:#2c7be5;
    color:white;
}

.stop{
    background:#dc3545;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>Timer Oficial do Treino</h1>

<p>40 segundos de ação • 20 segundos de descanso</p>

<div class="block" id="block">Pronto para começar</div>

<div class="exercise" id="exercise">—</div>

<div class="phase" id="phase">—</div>

<div class="timer" id="timer">00:40</div>

<div class="series" id="series">—</div>

<button class="start" onclick="startWorkout(1)">
Treino Rápido (12 min)
</button>

<button class="start" onclick="startWorkout(2)">
Treino Completo (25 min)
</button>

<button class="stop" onclick="stopWorkout()">
Parar
</button>

</div>

<script>

const exercises = [

{
block:"Bloco 1 • Cardio e Pernas",
name:"Agachamento Livre com Insistência"
},
{
block:"Bloco 1 • Cardio e Pernas",
name:"Agachamento Livre com Insistência"
},
{
block:"Bloco 1 • Cardio e Pernas",
name:"Passada para Trás (Afundo Alternado)"
},
{
block:"Bloco 1 • Cardio e Pernas",
name:"Passada para Trás (Afundo Alternado)"
},

{
block:"Bloco 2 • Braços e Costas",
name:"Flexão de Braço"
},
{
block:"Bloco 2 • Braços e Costas",
name:"Flexão de Braço"
},
{
block:"Bloco 2 • Braços e Costas",
name:'Extensão de Tronco "YTW"'
},
{
block:"Bloco 2 • Braços e Costas",
name:'Extensão de Tronco "YTW"'
},

{
block:"Bloco 3 • Core",
name:"Prancha Toque no Ombro"
},
{
block:"Bloco 3 • Core",
name:"Prancha Toque no Ombro"
},
{
block:"Bloco 3 • Core",
name:"Abdominal Remador Completo"
},
{
block:"Bloco 3 • Core",
name:"Abdominal Remador Completo"
}

];

let rounds = 1;
let workIndex = 0;
let currentRound = 1;
let phase = "work";
let timeLeft = 40;
let interval;

function beep(freq=900,duration=200){

const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
const gain = ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.value = freq;
gain.gain.value = 0.2;

osc.start();

setTimeout(()=>{
osc.stop();
},duration);
}

function updateDisplay(){

const mins = String(Math.floor(timeLeft/60)).padStart(2,'0');
const secs = String(timeLeft%60).padStart(2,'0');

document.getElementById("timer").innerText =
`${mins}:${secs}`;

document.getElementById("phase").innerText =
phase === "work"
? "EXERCÍCIO"
: "DESCANSO";

if(workIndex < exercises.length){

document.getElementById("block").innerText =
exercises[workIndex].block;

document.getElementById("exercise").innerText =
exercises[workIndex].name;
}

document.getElementById("series").innerText =
`Exercício ${workIndex+1} de ${exercises.length} • Volta ${currentRound}/${rounds}`;
}

function startWorkout(totalRounds){

stopWorkout();

rounds = totalRounds;
currentRound = 1;
workIndex = 0;
phase = "work";
timeLeft = 40;

updateDisplay();

interval = setInterval(()=>{

timeLeft--;

updateDisplay();

if(timeLeft <= 0){

beep();

if(phase === "work"){

phase = "rest";
timeLeft = 20;

}else{

workIndex++;

if(workIndex >= exercises.length){

if(currentRound >= rounds){

stopWorkout();

document.getElementById("phase").innerText =
"TREINO CONCLUÍDO";

document.getElementById("exercise").innerText =
"Parabéns!";

document.getElementById("block").innerText =
"Excelente trabalho";

beep(1200,600);
return;
}

currentRound++;
workIndex = 0;
}

phase = "work";
timeLeft = 40;
}

updateDisplay();
}

},1000);
}

function stopWorkout(){
clearInterval(interval);
}

updateDisplay();

</script>

</body>
</html>
